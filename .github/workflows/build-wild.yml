name: build wild

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  build:
    # reusable workflow のジョブは呼び出し側の権限を上限にするため、
    # ここで id-token を渡さないと attestation の署名ができない
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-variant.yml
    with:
      stage: wild
    secrets: inherit
