name: build wild

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  build:
    # reusable workflow の chain では permission を上げられず、呼び出し側が
    # 上限になる。呼ばれる側の全ジョブが要求するものをここで渡す
    #   build-push: packages(ghcr へ push) / id-token, attestations(署名)
    #   summary:    actions(ジョブの conclusion を API から読む)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    uses: ./.github/workflows/build-variant.yml
    with:
      stage: wild
    secrets: inherit
