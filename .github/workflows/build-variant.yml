name: build variant

# variant ごとに別 run にする。matrix の上限は 1 run あたり 256 ジョブで、
# 全 variant を 1 run に入れるとバージョンを増やしたときに先に当たる
on:
  workflow_call:
    inputs:
      stage:
        description: ビルドする最終ステージ（default / mold / wild）
        required: true
        type: string

jobs:
  # matrix は bake から 1 回で全部作る。呼ばれる側で作ると、バージョンごとに
  # 同じことをする prepare が並ぶ（13 バージョンなら 13 件）
  prepare:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
      targets: ${{ steps.matrix.outputs.targets }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Build the job matrix
      id: matrix
      run: |
        # docker-bake.hcl を単一のソースにする。bake --print は daemon 不要で、
        # buildx は runner に同梱されている。
        # rust のリリース記録は docker-bake.hcl の RUST_LATEST_RELEASE 側にあり、
        # ここでは読まない（ビルドに使うのはイメージが存在するバージョン）。
        #
        # target 名にはドットが使えず "1-91-0-bookworm" の形なので、タグに使う値は
        # args から導出する。is_latest / is_minor_latest はどちらも一覧の並び順では
        # なく semver 比較で決める。同じ minor に patch が複数あるとき minor タグを
        # 両方が書くと後勝ちになるため、その minor 系で最新の patch だけに付ける
        map=$(docker buildx bake --print 2>/dev/null | jq -c --arg stage '${{ inputs.stage }}' '
          def vkey: split(".") | map(tonumber);
          def minor: split(".")[0:2] | join(".");
          def major: split(".")[0];
          ([.target[].args.RUST_VERSION] | unique) as $all
          | ($all | max_by(vkey)) as $latest
          | ($all | group_by(minor) | map(max_by(vkey))) as $minor_latest
          | ($all | group_by(major) | map(max_by(vkey))) as $major_latest
          | [ .target | to_entries[]
              | select((.value.target // "default") == $stage)
              | .value.args.RUST_VERSION as $v
              # 最終ステージ名がそのまま variant になる（default は素のイメージ）
              | (if (.value.target // "default") == "default" then ""
                 else "-" + .value.target end) as $variant
              | { target: .key,
                  minor: ($v | minor),
                  major: ($v | major),
                  is_latest: ($v == $latest),
                  is_minor_latest: (($minor_latest | index($v)) != null),
                  is_major_latest: (($major_latest | index($v)) != null),
                  is_default_base: (.value.args.IS_DEFAULT_BASE == "true"),
                  variant: $variant,
                  version: $v,
                  suffix: ((.value.args.BASE_TAG | ltrimstr($v + "-")) + $variant) } ]
          | group_by(.version) | map({key: .[0].version, value: .}) | from_entries')

        {
          echo "targets=${map}"
          # 新しいバージョンから並べる
          echo "versions=$(jq -cn --argjson m "${map}" \
            '$m | keys_unsorted | sort_by(split(".") | map(tonumber)) | reverse')"
        } >> "${GITHUB_OUTPUT}"

  # バージョンごとに reusable workflow を呼ぶ。Actions の UI では
  # "1.91.0 / bookworm-mold" のようにバージョンでまとまって表示される
  build:
    name: ${{ matrix.rust_version }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        rust_version: ${{ fromJson(needs.prepare.outputs.versions) }}
    # reusable workflow のジョブは呼び出し側の権限を上限にするため、
    # ここで id-token を渡さないと attestation の署名ができない
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-version.yml
    with:
      rust_version: ${{ matrix.rust_version }}
      stage: ${{ inputs.stage }}
      targets: ${{ toJson(fromJson(needs.prepare.outputs.targets)[matrix.rust_version]) }}
    secrets: inherit

  # 各 build-push が上げた検証結果と、run 全体のジョブの成否をまとめて
  # job summary に出す。ビルドが落ちた run でこそ見たいので always
  summary:
    name: summary
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # 各 build-push でも同じ検証をしているが、表のためだけに artifact を
    # 経由すると、そのやり取り自体が壊れたときに表が空になるだけで気づけない。
    # ここは registry から読み直す。読めなかった target は表で — になり、
    # 1 件も読めなかったのに成功したビルドがある場合は renderer が落ちる。
    #
    # 読むのは sha 付きのタグ。バージョンのタグはビルドが失敗しても前の run
    # のイメージを指すので、失敗したビルドの行に古いイメージの検証結果と
    # サイズが並んでしまう。表示名は --label でバージョンのタグに戻す
    - name: Collect the image facts
      if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      run: |
        mkdir -p image-facts
        docker buildx bake --print 2>/dev/null \
          | jq -r --arg stage '${{ inputs.stage }}' '
              .target | to_entries[]
              | select((.value.target // "default") == $stage)
              | [.value.args.RUST_VERSION, .value.args.BASE_TAG] | @tsv' \
          | while IFS=$'\t' read -r version base_tag; do
              suffix="${base_tag#"${version}-"}"
              if [ '${{ inputs.stage }}' != default ]; then
                suffix="${suffix}-${{ inputs.stage }}"
              fi
              echo "::group::${version}-${suffix}"
              # 不一致はゲート側（build-push）が既に落としている。ここでは
              # 表に出すため、読めなくても次へ進む
              .github/scripts/verify-base-layers.py \
                "ghcr.io/${{ github.repository }}:sha-${GITHUB_SHA:0:7}-${version}-${suffix}" \
                "${base_tag}" --expect-extra 1 \
                --label "${version}-${suffix}" \
                --json "image-facts/${version}-${suffix}.json" || true
              echo "::endgroup::"
            done

    - name: Render the image summary
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # ビルドの成否はジョブの conclusion が持っている。matrix ジョブの
        # outputs は互いに上書きするため、artifact ではなく API から読む
        gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
          --paginate --jq '.jobs[]' | jq -s '.' > jobs.json

        # summary ファイルは後から読めないので、ログにも同じものを残す
        # push する run では facts が取れて当然なので、1 件も無いのに
        # 成功したビルドがあるなら表の作り方が壊れている
        expect_facts=""
        if [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
          expect_facts="--expect-facts"
        fi

        # summary ファイルは後から読めないので、ログにも同じものを残す
        .github/scripts/render-image-summary.py --jobs jobs.json --facts image-facts \
          ${expect_facts} | tee -a "${GITHUB_STEP_SUMMARY}"
