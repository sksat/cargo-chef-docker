name: build version

on:
  workflow_call:
    inputs:
      rust_version:
        description: ビルドする rust のバージョン
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      targets: ${{ steps.targets.outputs.targets }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Build the job matrix for this rust version
      id: targets
      run: |
        # target 名にはドットが使えず "1-91-0-bookworm" の形なので、
        # タグに使う値は args から導出する。
        # is_latest / is_minor_latest はどちらも一覧の並び順ではなく semver 比較で決める。
        # 同じ minor に patch が複数あるとき minor タグを両方が書くと後勝ちになるため、
        # その minor 系で最新の patch だけに付ける
        echo "targets=$(docker buildx bake --print 2>/dev/null | jq -c --arg v '${{ inputs.rust_version }}' '
          def vkey: split(".") | map(tonumber);
          def minor: split(".")[0:2] | join(".");
          def major: split(".")[0];
          ([.target[].args.RUST_VERSION] | unique) as $all
          | ($all | max_by(vkey)) as $latest
          | ($all | group_by(minor) | map(max_by(vkey))) as $minor_latest
          | ($all | group_by(major) | map(max_by(vkey))) as $major_latest
          | [ .target | to_entries[]
              | select(.value.args.RUST_VERSION == $v)
              # 最終ステージ名がそのまま variant になる（default は素のイメージ）
              | (if (.value.target // "default") == "default" then ""
                 else "-" + .value.target end) as $variant
              | { target: .key,
                  minor: ($v | minor),
                  major: ($v | major),
                  is_latest: ($v == $latest),
                  is_minor_latest: (($minor_latest | index($v)) != null),
                  is_major_latest: (($major_latest | index($v)) != null),
                  is_default_base: (.value.args.IS_DEFAULT_BASE == "true"),
                  variant: $variant,
                  suffix: ((.value.args.BASE_TAG | ltrimstr($v + "-")) + $variant) } ]
        ')" >> "${GITHUB_OUTPUT}"

  build-push:
    name: ${{ matrix.suffix }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.targets) }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # ghcr への push と、attestation を referrer として置くのに要る
      packages: write
      # Sigstore で署名するための OIDC トークン
      id-token: write
      attestations: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Read image metadata from docker-bake.hcl
      id: bake_meta
      run: |
        # ベースイメージのタグと mold の有無はどちらも bake 側の定義なので、
        # workflow で組み立て直さず解決済みの値を読む
        printed=$(docker buildx bake "${{ matrix.target }}" --print 2>/dev/null)
        base_tag=$(jq -r '.target."${{ matrix.target }}".args.BASE_TAG' <<< "${printed}")
        stage=$(jq -r '.target."${{ matrix.target }}".target // "default"' <<< "${printed}")

        description="Prebuilt rust:${base_tag} image with cargo-chef for faster Docker layer caching"
        if [ "${stage}" != "default" ]; then
          description="${description}, plus the ${stage} linker"
        fi
        {
          echo "description=${description}"
          echo "stage=${stage}"
          echo "base_tag=${base_tag}"
        } >> "${GITHUB_OUTPUT}"

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      env:
        # GitHub Packages は multi-arch イメージの description を index の
        # annotations から読む。デフォルトの manifest だけでは表示されない
        DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
      with:
        images: |
          ghcr.io/${{ github.repository }},enable=true
          sksat/${{ github.event.repository.name }},enable=true
        # sha / pr タグにも rust_version を入れる。入れないとバージョンが
        # 複数あるとき同じタグに別イメージを push してしまう
        # 公式 rust イメージの命名規則に揃える。
        #   Tags: 1-trixie, 1.98-trixie, 1.98.0-trixie, trixie, 1, 1.98, 1.98.0, latest
        #   Tags: 1-bookworm, 1.98-bookworm, 1.98.0-bookworm, bookworm
        # <base> 単独はその base の最新版を指す。latest-<base> は従来からある別名として残す。
        # デフォルト base（trixie）は base なしのタグも持つ。mold は variant を付けて
        # 1.91.0-mold の形にし、bare な mold は作らない（base が読み取れないため）
        # major / minor のタグは、その系列で最新の patch にだけ付ける
        # （複数並ぶとき後勝ちになるのを避ける）
        tags: |
          type=raw,value=${{ inputs.rust_version }},suffix=-${{ matrix.suffix }},enable={{is_default_branch}}
          type=raw,value=${{ matrix.minor }},suffix=-${{ matrix.suffix }},enable=${{ matrix.is_minor_latest && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          type=raw,value=${{ matrix.major }},suffix=-${{ matrix.suffix }},enable=${{ matrix.is_major_latest && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          type=raw,value=${{ matrix.suffix }},enable=${{ matrix.is_latest && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          type=raw,value=latest,suffix=-${{ matrix.suffix }},enable=${{ matrix.is_latest && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          type=raw,value=${{ inputs.rust_version }}${{ matrix.variant }},enable=${{ matrix.is_default_base && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          type=raw,value=${{ matrix.minor }}${{ matrix.variant }},enable=${{ matrix.is_default_base && matrix.is_minor_latest && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          type=raw,value=${{ matrix.major }}${{ matrix.variant }},enable=${{ matrix.is_default_base && matrix.is_major_latest && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          type=raw,value=latest${{ matrix.variant }},enable=${{ matrix.is_default_base && matrix.is_latest && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          type=sha,suffix=-${{ inputs.rust_version }}-${{ matrix.suffix }}
          type=ref,event=pr,suffix=-${{ inputs.rust_version }}-${{ matrix.suffix }}
        # 既定ではリポジトリの description が入る。labels と annotations は
        # それぞれ別の input から組まれるため両方に指定する
        labels: |
          org.opencontainers.image.description=${{ steps.bake_meta.outputs.description }}
        annotations: |
          org.opencontainers.image.description=${{ steps.bake_meta.outputs.description }}

    - name: Use mirror.gcr.io as a Docker Hub mirror
      run: |
        # host の docker daemon 経由の pull（tonistiigi/binfmt, moby/buildkit）
        sudo mkdir -p /etc/docker
        tmp=$(mktemp)
        if [ -s /etc/docker/daemon.json ]; then
          jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' /etc/docker/daemon.json > "${tmp}"
        else
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' > "${tmp}"
        fi
        sudo cp "${tmp}" /etc/docker/daemon.json
        sudo systemctl restart docker
        docker info --format 'daemon registry mirrors: {{json .RegistryConfig.Mirrors}}'

    - name: Set up QEMU
      uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      with:
        # buildkitd 経由の pull（Dockerfile の FROM が引く rust イメージ）
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]

    - name: Login to ghcr.io
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to DockerHub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      with:
        username: sksat
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & Push container image
      id: build
      uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
      env:
        # 参照先は docker-bake.hcl の CACHE_REF に集約されている
        CACHE_TO: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'registry' || '' }}
      with:
        targets: ${{ matrix.target }}
        files: |
          ./docker-bake.hcl
          cwd://${{ steps.meta.outputs.bake-file }}
          cwd://${{ steps.meta.outputs.bake-file-annotations }}
        push: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        # attestation は push するときだけ。provenance は buildx の既定でも
        # 付くが、既定値に依存せず mode を明示する。SBOM は既定では付かない
        provenance: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'mode=max' || 'false' }}
        sbom: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

    - name: Test image
      run: |
        # platform は docker-bake.hcl の target 定義から読む。ハードコードすると
        # target ごとに platform を変えたときにテスト対象がずれる
        platforms=$(docker buildx bake "${{ matrix.target }}" --print 2>/dev/null \
          | jq -r '.target."${{ matrix.target }}".platforms[]')
        echo "platforms: ${platforms}"

        # multi-platform ビルドは --load できないため、platform ごとに単一 platform で load する
        for platform in ${platforms}; do
          echo "::group::${platform}"
          docker buildx bake "${{ matrix.target }}" \
            --set "*.platform=${platform}" \
            --set "*.tags=cargo-chef-test:${{ matrix.target }}" \
            --load
          docker run --rm "cargo-chef-test:${{ matrix.target }}" cargo chef --version
          # variant のステージ名は入れた linker の名前でもある
          if [ "${{ steps.bake_meta.outputs.stage }}" != "default" ]; then
            docker run --rm "cargo-chef-test:${{ matrix.target }}" \
              "${{ steps.bake_meta.outputs.stage }}" --version
          fi
          echo "::endgroup::"
        done

    # bake が付ける SLSA provenance / SBOM はイメージの隣に置かれた未署名の
    # メタデータで、push 権限があれば差し替えられる。Sigstore で署名した
    # attestation を別に作り、`gh attestation verify` で検証できるようにする
    - name: Attest the build provenance
      id: attest
      if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ghcr.io/${{ github.repository }}
        subject-digest: ${{ fromJSON(steps.build.outputs.metadata)[matrix.target]['containerimage.digest'] }}
        # referrer として registry にも置く。GitHub の store だけに頼らない
        push-to-registry: true

    - name: Verify the attestation
      if: ${{ steps.attest.outcome == 'success' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 署名が実際に検証できることまで CI で確かめる
        gh attestation verify \
          "oci://ghcr.io/${{ github.repository }}@${{ fromJSON(steps.build.outputs.metadata)[matrix.target]['containerimage.digest'] }}" \
          --repo "${{ github.repository }}"

    - name: Verify the layers against the official image
      id: verify
      if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      run: |
        # どの variant も公式イメージに 1 層だけ乗る形にしている
        expect_extra=1

        mkdir -p image-facts
        # push 済みの index を registry から読む。ローカルの load では
        # 非圧縮サイズしか取れず、platform ごとに load し直す必要もある
        .github/scripts/verify-base-layers.py \
          "ghcr.io/${{ github.repository }}:${{ inputs.rust_version }}-${{ matrix.suffix }}" \
          "${{ steps.bake_meta.outputs.base_tag }}" \
          --expect-extra "${expect_extra}" \
          --json "image-facts/${{ inputs.rust_version }}-${{ matrix.suffix }}.json"

    # 一覧は run 全体で 1 枚にまとめたいので、ここでは事実だけ渡す。
    # 検証が落ちても結果を表に出したいので always
    - name: Upload the image facts
      if: ${{ always() && steps.verify.outcome != 'skipped' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: image-facts-${{ inputs.rust_version }}-${{ matrix.suffix }}
        path: image-facts/
        if-no-files-found: ignore
        retention-days: 1
