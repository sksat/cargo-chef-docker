name: Build Container Image

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      rust_versions: ${{ steps.versions.outputs.rust_versions }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Read the rust version list from docker-bake.hcl
      id: versions
      run: |
        # docker-bake.hcl を単一のソースにする。bake --print は daemon 不要で、
        # buildx は runner に同梱されている。
        # rust-toolchain は rust のリリース記録として残しており、ここでは読まない
        # （ビルドに使うのはイメージが存在するバージョンで、別物）
        echo "rust_versions=$(docker buildx bake --print 2>/dev/null \
          | jq -c '[.target[].args.RUST_VERSION] | unique')" >> "${GITHUB_OUTPUT}"

  # バージョンごとに reusable workflow を呼ぶ。Actions の UI では
  # "1.91.0 / bookworm-mold" のようにバージョンでまとまって表示される
  build:
    name: ${{ matrix.rust_version }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        rust_version: ${{ fromJson(needs.prepare.outputs.rust_versions) }}
    uses: ./.github/workflows/build-version.yml
    with:
      rust_version: ${{ matrix.rust_version }}
    secrets: inherit
