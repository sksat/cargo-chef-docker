name: Build Container Image

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  rust_version:
    runs-on: ubuntu-latest

    outputs:
      rust_version: ${{ steps.rust_ver.outputs.rust_version }}

    steps:
    - uses: actions/checkout@v5.1.0
    - name: Get Rust version
      id: rust_ver
      run: |
        echo "rust_version=$(awk -F'[ ="]+' '$1 == "channel" { print $2 }' rust-toolchain)" >> "${GITHUB_OUTPUT}"
        echo "${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}"

  build_and_push:
    name: Build and Push
    needs: rust_version
    strategy:
      fail-fast: false
      matrix:
        base_img: [slim, trixie, slim-trixie, bookworm, slim-bookworm]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5.1.0

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5.10.0
      with:
        images: |
          ghcr.io/${{ github.repository }},enable=true
          sksat/${{ github.event.repository.name }},enable=true
        flavor: |
          latest=auto
          suffix=-${{ needs.rust_version.outputs.rust_version }}-${{ matrix.base_img }},onlatest=false
          suffix=-${{ matrix.base_img }},onlatest=true
        tags: |
          type=sha
          type=ref,event=pr
          type=raw,value=${{ needs.rust_version.outputs.rust_version }},enable={{is_default_branch}}

    - name: Use mirror.gcr.io as a Docker Hub mirror
      run: |
        # host の docker daemon 経由の pull（tonistiigi/binfmt, moby/buildkit）
        sudo mkdir -p /etc/docker
        tmp=$(mktemp)
        if [ -s /etc/docker/daemon.json ]; then
          jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' /etc/docker/daemon.json > "${tmp}"
        else
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' > "${tmp}"
        fi
        sudo cp "${tmp}" /etc/docker/daemon.json
        sudo systemctl restart docker
        docker info --format 'daemon registry mirrors: {{json .RegistryConfig.Mirrors}}'

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4.3.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.3.0
      with:
        # buildkitd 経由の pull（Dockerfile の FROM が引く rust イメージ）
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]

    - name: Login to ghcr.io
      uses: docker/login-action@v4.6.0
      if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to DockerHub
      uses: docker/login-action@v4.6.0
      if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      with:
        username: sksat
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & Push container image
      uses: docker/build-push-action@v7.3.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64,linux/386
        build-args: |
          BASE_TAG=${{ needs.rust_version.outputs.rust_version }}-${{ matrix.base_img }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        push: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        cache-from: type=registry,ref=ghcr.io/sksat/cargo-chef-docker:buildcache-${{ matrix.base_img }}
        cache-to: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && format('type=registry,ref=ghcr.io/sksat/cargo-chef-docker:buildcache-{0},mode=max', matrix.base_img) || '' }}

    - name: Test image
      run: |
        # multi-platform ビルドは --load できないため、platform ごとに単一 platform で load する。
        # 直前のビルドと同じ内容なので buildkit のローカルキャッシュにヒットする
        for platform in linux/amd64 linux/arm64 linux/386; do
          echo "::group::${platform}"
          docker buildx build \
            --platform "${platform}" \
            --build-arg "BASE_TAG=${{ needs.rust_version.outputs.rust_version }}-${{ matrix.base_img }}" \
            --cache-from "type=registry,ref=ghcr.io/sksat/cargo-chef-docker:buildcache-${{ matrix.base_img }}" \
            --load -t "cargo-chef-test:${{ matrix.base_img }}" .
          docker run --rm "cargo-chef-test:${{ matrix.base_img }}" cargo chef --version
          echo "::endgroup::"
        done
