name: Build Container Image

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      rust_version: ${{ steps.rust_ver.outputs.rust_version }}
      base_imgs: ${{ steps.base_imgs.outputs.base_imgs }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Get Rust version
      id: rust_ver
      run: |
        echo "rust_version=$(awk -F'[ ="]+' '$1 == "channel" { print $2 }' rust-toolchain)" >> "${GITHUB_OUTPUT}"
        echo "${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}"

    - name: Get base image list from docker-bake.hcl
      id: base_imgs
      run: |
        # docker-bake.hcl を base_img 一覧の単一のソースにする。
        # bake --print は daemon 不要で、buildx は runner に同梱されている
        echo "base_imgs=$(docker buildx bake --print 2>/dev/null | jq -c '.group.default.targets')" >> "${GITHUB_OUTPUT}"

  build_and_push:
    name: Build and Push
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        base_img: ${{ fromJson(needs.prepare.outputs.base_imgs) }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Read image metadata from docker-bake.hcl
      id: bake_meta
      env:
        RUST_VERSION: ${{ needs.prepare.outputs.rust_version }}
      run: |
        # ベースイメージのタグと mold の有無はどちらも bake 側の定義なので、
        # workflow で組み立て直さず解決済みの値を読む
        printed=$(docker buildx bake "${{ matrix.base_img }}" --print 2>/dev/null)
        base_tag=$(jq -r '.target."${{ matrix.base_img }}".args.BASE_TAG' <<< "${printed}")
        stage=$(jq -r '.target."${{ matrix.base_img }}".target // "default"' <<< "${printed}")

        description="Prebuilt rust:${base_tag} image with cargo-chef for faster Docker layer caching"
        if [ "${stage}" = "mold" ]; then
          description="${description}, plus the mold linker"
        fi
        echo "description=${description}" >> "${GITHUB_OUTPUT}"
        echo "stage=${stage}" >> "${GITHUB_OUTPUT}"

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      env:
        # GitHub Packages は multi-arch イメージの description を index の
        # annotations から読む。デフォルトの manifest だけでは表示されない
        DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
      with:
        images: |
          ghcr.io/${{ github.repository }},enable=true
          sksat/${{ github.event.repository.name }},enable=true
        flavor: |
          latest=auto
          suffix=-${{ needs.prepare.outputs.rust_version }}-${{ matrix.base_img }},onlatest=false
          suffix=-${{ matrix.base_img }},onlatest=true
        tags: |
          type=sha
          type=ref,event=pr
          type=raw,value=${{ needs.prepare.outputs.rust_version }},enable={{is_default_branch}}
        # 既定ではリポジトリの description が入る。labels と annotations は
        # それぞれ別の input から組まれるため両方に指定する
        labels: |
          org.opencontainers.image.description=${{ steps.bake_meta.outputs.description }}
        annotations: |
          org.opencontainers.image.description=${{ steps.bake_meta.outputs.description }}

    - name: Use mirror.gcr.io as a Docker Hub mirror
      run: |
        # host の docker daemon 経由の pull（tonistiigi/binfmt, moby/buildkit）
        sudo mkdir -p /etc/docker
        tmp=$(mktemp)
        if [ -s /etc/docker/daemon.json ]; then
          jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' /etc/docker/daemon.json > "${tmp}"
        else
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' > "${tmp}"
        fi
        sudo cp "${tmp}" /etc/docker/daemon.json
        sudo systemctl restart docker
        docker info --format 'daemon registry mirrors: {{json .RegistryConfig.Mirrors}}'

    - name: Set up QEMU
      uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      with:
        # buildkitd 経由の pull（Dockerfile の FROM が引く rust イメージ）
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]

    - name: Login to ghcr.io
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to DockerHub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      with:
        username: sksat
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & Push container image
      uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
      env:
        RUST_VERSION: ${{ needs.prepare.outputs.rust_version }}
        # 参照先は docker-bake.hcl の CACHE_REF に集約されている
        CACHE_TO: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'registry' || '' }}
      with:
        targets: ${{ matrix.base_img }}
        files: |
          ./docker-bake.hcl
          cwd://${{ steps.meta.outputs.bake-file }}
          cwd://${{ steps.meta.outputs.bake-file-annotations }}
        push: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

    - name: Test image
      env:
        RUST_VERSION: ${{ needs.prepare.outputs.rust_version }}
      run: |
        # platform は docker-bake.hcl の target 定義から読む。ハードコードすると
        # target ごとに platform を変えたときにテスト対象がずれる
        platforms=$(docker buildx bake "${{ matrix.base_img }}" --print 2>/dev/null \
          | jq -r '.target."${{ matrix.base_img }}".platforms[]')
        echo "platforms: ${platforms}"

        # multi-platform ビルドは --load できないため、platform ごとに単一 platform で load する
        for platform in ${platforms}; do
          echo "::group::${platform}"
          docker buildx bake "${{ matrix.base_img }}" \
            --set "*.platform=${platform}" \
            --set "*.tags=cargo-chef-test:${{ matrix.base_img }}" \
            --load
          docker run --rm "cargo-chef-test:${{ matrix.base_img }}" cargo chef --version
          if [ "${{ steps.bake_meta.outputs.stage }}" = "mold" ]; then
            docker run --rm "cargo-chef-test:${{ matrix.base_img }}" mold --version
          fi
          echo "::endgroup::"
        done
